<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>haze arcade</title>
  <meta name="theme-color" content="#050506" />
  <meta name="description" content="Haze Arcade — a hand-picked library of browser games, from instant classics to WebGPU experiments." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="games.css" />
  <script src="haze-config.js"></script>
</head>
<body>
  <div class="g-shell">
    <nav class="g-nav" aria-label="Game library">
      <button class="g-logo" id="g-home" type="button" title="All games">
        <span class="g-logo-mark" aria-hidden="true">h</span>
        <span class="g-logo-copy">haze<small>arcade</small></span>
      </button>
      <span class="g-div" aria-hidden="true"></span>
      <div class="g-tools">
        <button class="g-ico" id="g-random" type="button" title="Surprise me" aria-label="Open a random game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3.2c4.6 0 6.4 10 10.8 10H20"/><path d="m17 14 3 3-3 3"/><path d="M4 17h3.2c1.5 0 2.7-1.1 3.8-2.6"/><path d="M13 9.6C13.9 8.1 15 7 16.2 7H20"/><path d="m17 4 3 3-3 3"/></svg>
        </button>
        <button class="g-ico" id="g-favmode" type="button" title="Favorites only" aria-label="Show favorites only" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.7l5.9-.8L12 3.5z"/></svg>
        </button>
        <button class="g-ico" id="g-reset" type="button" title="Clear history and favorites" aria-label="Clear history and favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <span class="g-nav-spacer"></span>
      <label class="g-search" aria-label="Search games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5"/></svg>
        <input id="g-search" type="text" placeholder="Search the arcade…" autocomplete="off" />
      </label>
      <label class="g-sort-wrap" title="Sort games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h7M4 17h4"/><path d="m17 8 3-3 3 3M20 5v11"/></svg>
        <select id="g-sort" aria-label="Sort games">
          <option value="default">A&#8594;Z</option>
          <option value="plays">Most played</option>
          <option value="recent">Recently played</option>
        </select>
      </label>
      <span class="g-count" id="g-count"></span>
    </nav>

    <header class="g-hero" id="g-hero" hidden>
      <div class="g-hero-bg" id="g-hero-bg"></div>
      <div class="g-hero-glow" aria-hidden="true"></div>
      <div class="g-hero-grid" aria-hidden="true"></div>
      <div class="g-hero-scan" aria-hidden="true"></div>
      <div class="g-hero-topline">
        <span class="g-live"><i aria-hidden="true"></i>live in your browser</span>
        <span class="g-hero-index" id="g-hero-index">01 / 07</span>
      </div>
      <button class="g-hero-arrow" id="g-hero-prev" type="button" aria-label="Previous featured game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>
      </button>
      <div class="g-hero-info">
        <div class="g-hero-kicker" id="g-hero-kicker">Featured game</div>
        <div class="g-hero-title" id="g-hero-title"></div>
        <div class="g-hero-sub" id="g-hero-sub"></div>
        <div class="g-hero-tags" id="g-hero-tags"></div>
        <div class="g-hero-actions">
          <button class="g-hero-play" id="g-hero-play" type="button">
            <span class="g-play-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.8v14.4L20 12 7.5 4.8z"/></svg></span>
            <span id="g-hero-play-label">Play now</span>
            <span class="g-play-arrow" aria-hidden="true">&#8599;</span>
          </button>
          <a class="g-hero-hub" id="g-hero-hub" href="#" target="_blank" rel="noopener" hidden>
            <span id="g-hero-hub-label">Project hub</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5.5"/></svg>
          </a>
        </div>
      </div>
      <button class="g-hero-arrow" id="g-hero-next" type="button" aria-label="Next featured game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
      </button>
      <div class="g-hero-footer">
        <div class="g-hero-dots" id="g-hero-dots" aria-label="Featured games"></div>
        <span class="g-hero-caption">hand-picked by haze</span>
      </div>
    </header>

    <p class="g-status loading" id="g-status">Loading the library…</p>
    <div id="g-sections"></div>
  </div>
  <div class="g-pages" id="g-pages"></div>

  <div id="g-frame-wrap">
    <div class="g-frame-bar">
      <strong id="g-frame-title"></strong>
      <button id="g-frame-full" type="button">⛶ Fullscreen</button>
      <button id="g-frame-blank" type="button">↗ Blank</button>
      <button id="g-frame-close" type="button">✕ Close</button>
    </div>
    <iframe id="g-frame" title="game"></iframe>
  </div>

  <script>
    (function () {
      "use strict";
      var COVERS = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
      var RECENT_KEY = "haze-games-recent";
      var FAVS_KEY = "haze-games-favs";
      var PAGE_KEY = "haze-games-page";
      var PER_PAGE = 36;
      var zones = [];
      var games = [];
      var sections = document.getElementById("g-sections");
      var status = document.getElementById("g-status");
      var count = document.getElementById("g-count");
      var search = document.getElementById("g-search");
      var sortSel = document.getElementById("g-sort");
      var pagesEl = document.getElementById("g-pages");
      var favMode = false;
      var frameWrap = document.getElementById("g-frame-wrap");
      var frame = document.getElementById("g-frame");
      var frameTitle = document.getElementById("g-frame-title");
      var byId = {};
      var featured = [];
      var heroIdx = 0;
      var heroEl = document.getElementById("g-hero");

      if (heroEl) {
        heroEl.addEventListener("pointermove", function (e) {
          if (e.pointerType === "touch") return;
          var r = heroEl.getBoundingClientRect();
          heroEl.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
          heroEl.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
        });
        heroEl.addEventListener("pointerleave", function () {
          heroEl.style.removeProperty("--mx");
          heroEl.style.removeProperty("--my");
        });
      }

      function heroCover(g) {
        return (g.heroCover || g.cover || COVERS + "/" + g.id + ".png").replace("{COVER_URL}", COVERS);
      }

      function renderHero() {
        var hero = document.getElementById("g-hero");
        if (!featured.length) { hero.hidden = true; return; }
        hero.hidden = false;
        var g = featured[heroIdx % featured.length];
        var bg = heroCover(g);
        document.getElementById("g-hero-bg").style.backgroundImage = 'url("' + bg.replace(/"/g, '\\"') + '")';
        document.getElementById("g-hero-title").textContent = g.heroTitle || g.name;
        document.getElementById("g-hero-kicker").textContent =
          g.heroKicker || (g.external ? "Featured drop // external build" : "Featured game");

        var recents = recentMap();
        var plays = recents[g.id] && recents[g.id].plays || 0;
        if (g.external) {
          document.getElementById("g-hero-sub").textContent =
            g.externalNote || "External WebGPU game - opens in a new tab";
        } else {
          document.getElementById("g-hero-sub").textContent =
            plays > 0 ? plays + (plays === 1 ? " play" : " plays") + " · Included with haze — free to play" :
            "Included with haze — free to play";
        }

        var tagList = Array.isArray(g.heroTags) ? g.heroTags :
          (g.external ? ["WebGPU", "Opens in a new tab"] : ["Instant play", "No install"]);
        document.getElementById("g-hero-tags").innerHTML = tagList.map(function (tag) {
          return '<span class="g-hero-tag">' + esc(tag) + "</span>";
        }).join("");

        var hub = document.getElementById("g-hero-hub");
        if (g.heroHub) {
          hub.href = g.heroHub;
          hub.hidden = false;
          document.getElementById("g-hero-hub-label").textContent = g.heroHubLabel || "Project hub";
        } else {
          hub.hidden = true;
          hub.removeAttribute("href");
        }

        document.getElementById("g-hero-play-label").textContent = g.external ? "Launch game" : "Play now";
        document.getElementById("g-hero-index").textContent =
          String(heroIdx + 1).padStart(2, "0") + " / " + String(featured.length).padStart(2, "0");

        var dots = document.getElementById("g-hero-dots");
        dots.hidden = featured.length < 2;
        dots.innerHTML = featured.map(function (item, i) {
          return '<button type="button" data-hero="' + i + '" class="' + (i === heroIdx ? "on" : "") +
            '" aria-label="Show ' + esc(item.name) + '" aria-pressed="' + (i === heroIdx ? "true" : "false") + '"></button>';
        }).join("");
        Array.prototype.forEach.call(dots.querySelectorAll("button"), function (dot) {
          dot.addEventListener("click", function () {
            heroIdx = parseInt(dot.getAttribute("data-hero"), 10) || 0;
            renderHero();
          });
        });

        var multi = featured.length > 1;
        document.getElementById("g-hero-prev").hidden = !multi;
        document.getElementById("g-hero-next").hidden = !multi;
        document.getElementById("g-hero-play").onclick = function () { openGame(g); };
      }

      function heroStep(d) {
        if (!featured.length) return;
        heroIdx = (heroIdx + d + featured.length) % featured.length;
        renderHero();
      }

      function loadJson(key, fallback) {
        try {
          return JSON.parse(localStorage.getItem(key) || fallback);
        } catch (e) {
          return JSON.parse(fallback);
        }
      }
      function recentMap() { return loadJson(RECENT_KEY, "{}"); }
      function favList() { return loadJson(FAVS_KEY, "[]"); }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function cardHtml(g, meta) {
        var badges = "";
        if (g && g.external) badges += '<span class="g-badge ext">WebGPU</span>';
        if (meta.plays > 0) badges += '<span class="g-badge">\u25b6 ' + meta.plays + "</span>";
        if (meta.last) {
          var mins = Math.floor((Date.now() - meta.last) / 60000);
          var when = mins < 1 ? "now" : mins < 60 ? mins + "m ago" : mins < 1440 ? Math.floor(mins / 60) + "h ago" : Math.floor(mins / 1440) + "d ago";
          badges += '<span class="g-badge">' + when + "</span>";
        }
        var tagline = g.external ? "WebGPU · new tab" : "Browser game";
        return (
          '<div class="g-card" data-id="' + g.id + '" role="button" tabindex="0" aria-label="Play ' + esc(g.name) + '">' +
          '<span class="g-cover" data-initial="' + esc(String(g.name || "?").trim().charAt(0) || "?") + '"><img loading="lazy" src="' +
          esc((g.cover || COVERS + "/" + g.id + '.png').replace("{COVER_URL}", COVERS)) + '" alt="" onerror="this.remove()" />' +
          (badges ? '<span class="g-meta">' + badges + "</span>" : "") +
          '<span class="g-launch" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg></span>' +
          "</span>" +
          '<button class="g-fav' + (meta.fav ? " active" : "") + '" data-fav="' + g.id + '" title="' +
          (meta.fav ? "Remove from favorites" : "Add to favorites") + '" aria-label="' +
          (meta.fav ? "Remove " + esc(g.name) + " from favorites" : "Add " + esc(g.name) + " to favorites") +
          '" type="button">\u2605</button>' +
          '<span class="g-name">' + esc(g.name) + "</span>" +
          '<span class="g-tagline">' + tagline + "</span>" +
          "</div>"
        );
      }

      function section(title, list, clearLabel, rail) {
        var wrap = document.createElement("div");
        var h = document.createElement("div");
        h.className = "g-section-title";
        h.innerHTML = '<span class="g-section-label">' + title + "</span>" +
          (clearLabel ? ' <button class="g-clear" type="button">' + clearLabel + "</button>" : "") +
          '<span class="g-section-line"></span><span class="g-section-count">' + list.length + "</span>";
        wrap.appendChild(h);
        var grid = document.createElement("div");
        grid.className = rail ? "g-rail" : "g-grid";
        var recents = recentMap();
        var favs = favList();
        grid.innerHTML = list
          .map(function (g) {
            var meta = recents[g.id] || {};
            meta.fav = favs.indexOf(String(g.id)) !== -1;
            return cardHtml(g, meta);
          })
          .join("");
        wrap.appendChild(grid);
        if (clearLabel) {
          h.querySelector(".g-clear").addEventListener("click", function () {
            localStorage.removeItem(RECENT_KEY);
            render();
          });
        }
        return wrap;
      }

      // ---- pagination pill (1 … n with a window around the current page) ----
      function pageNumbers(cur, total) {
        if (total <= 8) {
          var all = [];
          for (var i = 1; i <= total; i++) all.push(i);
          return all;
        }
        var set = [1, cur - 1, cur, cur + 1, total];
        if (cur <= 4) set = [1, 2, 3, 4, 5, total];
        if (cur >= total - 3) set = [1, total - 4, total - 3, total - 2, total - 1, total];
        set = set.filter(function (p) { return p >= 1 && p <= total; });
        var uniq = [];
        for (var j = 0; j < set.length; j++) if (uniq.indexOf(set[j]) === -1) uniq.push(set[j]);
        uniq.sort(function (a, b) { return a - b; });
        return uniq;
      }

      function renderPages(cur, total) {
        pagesEl.innerHTML = "";
        if (total <= 1) return;
        var nums = pageNumbers(cur, total);
        var prev = 0;
        for (var i = 0; i < nums.length; i++) {
          var p = nums[i];
          if (prev && p - prev > 1) {
            var dots = document.createElement("span");
            dots.className = "g-dots";
            dots.textContent = "\u2026";
            pagesEl.appendChild(dots);
          }
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = String(p);
          if (p === cur) b.classList.add("on");
          b.addEventListener("click", function (page) {
            return function () {
              try { localStorage.setItem(PAGE_KEY, String(page)); } catch (e) {}
              render();
              window.scrollTo({ top: 0, behavior: "smooth" });
            };
          }(p));
          pagesEl.appendChild(b);
          prev = p;
        }
      }

      function render() {
        var q = search.value.trim().toLowerCase();
        var recents = recentMap();
        var favs = favList();
        var list = games.slice();
        if (favMode) {
          list = list.filter(function (g) { return favs.indexOf(String(g.id)) !== -1; });
        }
        if (q) {
          list = list.filter(function (g) { return g.name.toLowerCase().indexOf(q) !== -1; });
        }
        var sort = sortSel.value;
        if (sort === "plays") {
          list.sort(function (a, b) { return (recents[b.id] && recents[b.id].plays || 0) - (recents[a.id] && recents[a.id].plays || 0) || a.name.localeCompare(b.name); });
        } else if (sort === "recent") {
          list.sort(function (a, b) { return (recents[b.id] && recents[b.id].last || 0) - (recents[a.id] && recents[a.id].last || 0) || a.name.localeCompare(b.name); });
        } else {
          list.sort(function (a, b) { return a.name.localeCompare(b.name); });
        }
        count.textContent = list.length + (q ? " found" : " games");
        sections.innerHTML = "";
        renderPages(1, 1); // cleared by default

        if (!list.length) {
          status.textContent = favMode && !q ? "No favorites yet — tap \u2605 on any game." : q ? "No games match \"" + q + "\"." : "";
          status.hidden = !favMode && !q;
          status.className = "g-status empty";
          return;
        }
        status.hidden = true;

        // recents + favorites strips (only on the unfiltered, first-page view)
        if (!q && !favMode) {
          var recentGames = Object.keys(recents)
            .sort(function (a, b) { return (recents[b].last || 0) - (recents[a].last || 0); })
            .map(function (id) { return byId[id]; })
            .filter(Boolean)
            .slice(0, 12);
          if (recentGames.length) {
            sections.appendChild(section("\u23f1 Recently played", recentGames, "forget", true));
          }
          var favGames = favs.map(function (id) { return byId[id]; }).filter(Boolean);
          if (favGames.length) {
            sections.appendChild(section("\u2605 Favorites", favGames, null, true));
          }
          var total = Math.ceil(list.length / PER_PAGE);
          var cur = Math.min(parseInt(localStorage.getItem(PAGE_KEY) || "1", 10) || 1, total);
          if (cur < 1) cur = 1;
          try { localStorage.setItem(PAGE_KEY, String(cur)); } catch (e2) {}
          var pageList = list.slice((cur - 1) * PER_PAGE, cur * PER_PAGE);
          sections.appendChild(section("All games", pageList));
          renderPages(cur, total);
        } else {
          sections.appendChild(section(favMode ? "\u2605 Favorites" : "Results", list));
        }
      }

      var frameUrl = "";
      // stealth launch: game opens in an about:blank tab (no game URL in the
      // address bar), same technique as Settings -> "Open in about:blank"
      function openBlank(url, title) {
        var win = window.open("about:blank", "_blank");
        if (!win) return false;
        var t = String(title || "game").replace(/&/g, "&amp;").replace(/</g, "&lt;");
        var u = String(url).replace(/"/g, "&quot;");
        var doc = win.document;
        doc.open();
        doc.write("<!doctype html><html><head><title>" + t + "</title>" +
          "<style>html,body{margin:0;padding:0;height:100%;background:#050505;overflow:hidden}" +
          "iframe{border:0;width:100%;height:100%;display:block}</style></head>" +
          "<body><iframe src=\"" + u + "\" allowfullscreen allow=\"autoplay; fullscreen\"></iframe></body></html>");
        doc.close();
        return true;
      }

      function gamesBlankOn() {
        try { return !!JSON.parse(localStorage.getItem("haze-settings") || "{}").gamesBlank; }
        catch (e) { return false; }
      }

      function openGame(g) {
        // External WebGPU games set COOP/COEP and need cross-origin isolation
        // plus WebGPU + Memory64. A proxy frame or an about:blank wrapper breaks
        // that, so always hand off to a clean tab.
        if (g && g.external) {
          var ext = String(g.external);
          window.open(ext, "_blank", "noopener");
          var recents2 = recentMap();
          var meta2 = recents2[g.id] || { plays: 0, last: 0 };
          meta2.plays = (meta2.plays || 0) + 1;
          meta2.last = Date.now();
          recents2[g.id] = meta2;
          try { localStorage.setItem(RECENT_KEY, JSON.stringify(recents2)); } catch (e9) {}
          render();
          return;
        }
        frameTitle.textContent = g.name;
        // the zone url is "{HTML_URL}/<file>.html" - send the real filename,
        // 287 games have suffixed ones (e.g. 1-fde.html)
        var file = String(g.url).split("/").pop();
        var url = (typeof HazeApi === "function" ? HazeApi("/games/play/" + encodeURIComponent(file)) : "/games/play/" + encodeURIComponent(file));
        frameUrl = url;
        if (gamesBlankOn()) { openBlank(url, g.name); }
        else {
          frame.src = url;
          frameWrap.classList.add("open");
        }
        var recents = recentMap();
        var meta = recents[g.id] || { plays: 0, last: 0 };
        meta.plays = (meta.plays || 0) + 1;
        meta.last = Date.now();
        recents[g.id] = meta;
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recents)); } catch (e) {}
      }

      function closeGame() {
        frameWrap.classList.remove("open");
        frame.src = "about:blank";
        frameUrl = "";
        render(); // refresh play-count badges
      }

      sections.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var card = e.target.closest ? e.target.closest(".g-card") : null;
        if (!card || e.target !== card) return;
        e.preventDefault();
        var g = byId[card.dataset.id];
        if (g) openGame(g);
      });

      sections.addEventListener("click", function (e) {
        var favBtn = e.target.closest(".g-fav");
        if (favBtn) {
          e.stopPropagation();
          var id = favBtn.dataset.fav;
          var favs = favList();
          var idx = favs.indexOf(id);
          if (idx === -1) favs.push(id);
          else favs.splice(idx, 1);
          try { localStorage.setItem(FAVS_KEY, JSON.stringify(favs.slice(0, 30))); } catch (e2) {}
          render();
          return;
        }
        var card = e.target.closest(".g-card");
        if (!card) return;
        var g = byId[card.dataset.id];
        if (g) openGame(g);
      });

      document.getElementById("g-random").addEventListener("click", function () {
        if (!games.length) return;
        openGame(games[Math.floor(Math.random() * games.length)]);
      });
      document.getElementById("g-favmode").addEventListener("click", function () {
        favMode = !favMode;
        this.classList.toggle("on", favMode);
        this.setAttribute("aria-pressed", favMode ? "true" : "false");
        render();
      });
      document.getElementById("g-reset").addEventListener("click", function () {
        localStorage.removeItem(RECENT_KEY);
        localStorage.removeItem(FAVS_KEY);
        render();
      });
      document.getElementById("g-home").addEventListener("click", function () {
        favMode = false;
        search.value = "";
        var favButton = document.getElementById("g-favmode");
        favButton.classList.remove("on");
        favButton.setAttribute("aria-pressed", "false");
        try { localStorage.removeItem(PAGE_KEY); } catch (e) {}
        render();
      });
      sortSel.addEventListener("change", render);
      document.getElementById("g-hero-prev").addEventListener("click", function () { heroStep(-1); });
      document.getElementById("g-hero-next").addEventListener("click", function () { heroStep(1); });
      document.getElementById("g-frame-close").addEventListener("click", closeGame);
      document.getElementById("g-frame-blank").addEventListener("click", function () {
        if (!frameUrl) return;
        if (!openBlank(frameUrl, frameTitle.textContent)) {
          var b = this;
          b.textContent = "Popup blocked";
          setTimeout(function () { b.textContent = "\u2197 Blank"; }, 2000);
        }
      });
      document.getElementById("g-frame-full").addEventListener("click", function () {
        if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
        else frameWrap.requestFullscreen().catch(function () {});
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && frameWrap.classList.contains("open")) closeGame();
      });

      var searchTimer = null;
      search.addEventListener("input", function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(render, 120);
      });

      // mirror haze's accent color (same origin - settings are shared)
      try {
        var accent = JSON.parse(localStorage.getItem("haze-settings") || "{}").accent;
        if (accent) document.documentElement.style.setProperty("--ga", accent);
      } catch (e) {}

      // Flux catalog (github.com/blockfreeubg/flux — used as a reference):
      // ~3.3k extra games that live on the same freebuisness mirrors haze's
      // zones already use, so they launch through the fully same /games/play
      // proxy path. Adds any not already present (dedupe by launch file),
      // keeps the zones list authoritative for recents/featured.
      var FLUX_FILE_RE = /^[a-z0-9_-]+\.html$/;
      var fluxLoaded = false;
      function loadFluxExtras() {
        if (fluxLoaded) return;
        fluxLoaded = true;
        fetch("https://cdn.jsdelivr.net/gh/blockfreeubg/flux@main/public/games/games.json", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
          .then(function (fluxRaw) {
            // flux ships {games:[...]}; a bare array is accepted too
            var fluxList = Array.isArray(fluxRaw) ? fluxRaw : fluxRaw && fluxRaw.games;
            if (!Array.isArray(fluxList)) throw new Error("bad flux catalog");
            var zoneFiles = {};
            for (var zi = 0; zi < zones.length; zi++) {
              if (zones[zi] && zones[zi].url) zoneFiles[String(zones[zi].url).split("/").pop().toLowerCase()] = true;
            }
            var seenNames = {};
            for (var gi = 0; gi < games.length; gi++) seenNames[String(games[gi].name || "").trim().toLowerCase()] = true;
            var added = 0;
            for (var i = 0; i < fluxList.length; i++) {
              var e = fluxList[i];
              var file = String(e && e.url || "").split("/").pop().toLowerCase();
              if (!FLUX_FILE_RE.test(file) || zoneFiles[file]) continue;
              var name = String(e.name || "").trim();
              if (!name || seenNames[name.toLowerCase()]) continue;
              seenNames[name.toLowerCase()] = true;
              var g2 = {
                id: "flux-" + file.replace(/\.html$/, ""),
                name: name,
                url: "{HTML_URL}/" + file,
                cover: e.thumbnail || undefined
              };
              games.push(g2);
              byId[g2.id] = g2;
              added++;
            }
            if (added) {
              status.hidden = true; // a good library loaded even if zones.json failed
              render(); // re-sorted (name) and repaged by render()
            }
          })
          .catch(function () {}); // catalog extras are optional, zones is the base library
      }

      fetch((typeof HazeApi === "function" ? HazeApi("/games/zones.json") : "/games/zones.json"))
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (_zones) {
          zones = _zones;
          games = zones.filter(function (g) {
            return g && g.url && g.url.indexOf("{HTML_URL}") !== -1 && g.name;
          });
          for (var i = 0; i < games.length; i++) {
            games[i].id = String(games[i].id);
            byId[games[i].id] = games[i];
          }
          featured = [];
          for (var gi = 0; gi < games.length; gi++) {
            if (String(games[gi].id) === "851") {
              var gta3 = games.splice(gi, 1)[0];
              games.unshift(gta3);
              featured.push(gta3);
              break;
            }
          }
          var pool = games.slice(featured.length ? 1 : 0);
          while (featured.length < 7 && pool.length) {
            featured.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
          }
          heroIdx = 0;
          renderHero();
          render();
          loadFluxExtras();
        })
        .catch(function () {
          featured = [];
          heroIdx = 0;
          renderHero();
          render();
          status.hidden = false;
          status.textContent = "Couldn't load the game library — the catalog wasn't reachable. Reload to retry.";
          status.className = "g-status error";
          loadFluxExtras(); // still give the player the flux library
        });
    })();
  </script>
</body>
</html>
