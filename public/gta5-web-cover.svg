<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">GTA5 Web</title>
  <desc id="desc">A neon sunset over a stylized city, framed by palm trees and a giant V monogram.</desc>
  <defs>
