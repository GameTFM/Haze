<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="hazeTitle hazeDesc">
  <title id="hazeTitle">Haze</title>
  <desc id="hazeDesc">A standalone Haze brand card: one tab, your whole internet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="0.55" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8cff"/>
      <stop offset="0.48" stop-color="#b79bff"/>
      <stop offset="1" stop-color="#5fe0c0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.5" stop-color="#bba8ff"/>
      <stop offset="1" stop-color="#7ce8d0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#7b6dff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#7b6dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.8" r="0.8">
      <stop offset="0" stop-color="#4ee0be" stop-opacity=".2"/>
      <stop offset="1" stop-color="#4ee0be" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frame">
      <rect x="28" y="28" width="1144" height="574" rx="42"/>
    </clipPath>
    <style>
      .word { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
      .orb-a { animation: drift 9s ease-in-out infinite alternate; }
      .orb-b { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .spark { animation: pulse 4s ease-in-out infinite; }
      @keyframes drift { from { transform: translate3d(-18px, 8px, 0) scale(1); } to { transform: translate3d(26px, -16px, 0) scale(1.08); } }
      @keyframes pulse { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .orb-a, .orb-b, .spark { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <ellipse class="orb-a" cx="205" cy="120" rx="360" ry="240" fill="url(#glowA)" filter="url(#blur)"/>
    <ellipse class="orb-b" cx="1020" cy="555" rx="440" ry="300" fill="url(#glowB)" filter="url(#blur)"/>
    <path d="M-20 480 C 190 330, 340 590, 620 430 S 960 230, 1240 380" fill="none" stroke="url(#aurora)" stroke-opacity=".26" stroke-width="2"/>
    <path d="M-20 520 C 210 390, 410 610, 680 460 S 1000 290, 1240 430" fill="none" stroke="url(#aurora)" stroke-opacity=".12" stroke-width="1.5"/>
    <g opacity=".45">
      <circle cx="150" cy="92" r="2" fill="#fff"/><circle cx="930" cy="118" r="1.6" fill="#fff"/><circle cx="1080" cy="210" r="2" fill="#fff"/><circle cx="420" cy="548" r="1.4" fill="#fff"/><circle cx="760" cy="522" r="1.8" fill="#fff"/>
    </g>
  </g>

  <rect x="28" y="28" width="1144" height="574" rx="42" fill="none" stroke="#ffffff" stroke-opacity=".13"/>
  <rect x="46" y="46" width="1108" height="538" rx="30" fill="none" stroke="#ffffff" stroke-opacity=".045"/>

  <g transform="translate(86 94)">
    <rect x="0" y="0" width="132" height="132" rx="36" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".18"/>
    <g transform="translate(24 25)" fill="none" stroke="url(#mark)" stroke-linecap="round">
      <path d="M4 22 C 22 10, 41 10, 59 22 S 97 34, 115 22" stroke-width="5"/>
      <path d="M4 43 C 22 31, 41 31, 59 43 S 97 55, 115 43" stroke-width="5" opacity=".78"/>
      <path d="M4 64 C 22 52, 41 52, 59 64 S 97 76, 115 64" stroke-width="5" opacity=".52"/>
    </g>
    <circle class="spark" cx="111" cy="21" r="5" fill="#d9d0ff"/>
  </g>

  <g class="word">
    <text x="86" y="332" fill="#f7f5ff" font-size="126" font-weight="700" letter-spacing="-8">haze</text>
    <text x="90" y="383" fill="#a8a4b8" font-size="27" font-weight="500" letter-spacing=".2">one tab. your whole internet.</text>
  </g>

  <g transform="translate(92 458)">
    <g>
      <rect x="0" y="0" width="190" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="23" cy="21" r="3.5" fill="#b79bff"/>
      <text class="mono" x="37" y="26" fill="#d7d2e6" font-size="12" letter-spacing="1.3">AI COPILOT</text>
    </g>
    <g transform="translate(204 0)">
      <rect x="0" y="0" width="182" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="23" cy="21" r="3.5" fill="#5fe0c0"/>
      <text class="mono" x="37" y="26" fill="#d7d2e6" font-size="12" letter-spacing="1.3">PRIVATE TUNNEL</text>
    </g>
    <g transform="translate(400 0)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="23" cy="21" r="3.5" fill="#8f9cff"/>
      <text class="mono" x="37" y="26" fill="#d7d2e6" font-size="12" letter-spacing="1.3">GAMES + MUSIC</text>
    </g>
  </g>

  <g transform="translate(880 408)">
    <circle cx="114" cy="92" r="128" fill="#7b6dff" fill-opacity=".08" filter="url(#soft)"/>
    <circle cx="114" cy="92" r="74" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="114" cy="92" r="54" fill="none" stroke="url(#aurora)" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="114" cy="38" r="4" fill="#fff"/>
    <circle cx="163" cy="112" r="3" fill="#b79bff"/>
    <path d="M114 92 L114 52 M114 92 L148 108" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="114" cy="92" r="4" fill="#5fe0c0"/>
    <text class="mono" x="114" y="208" fill="#8f8a9f" font-size="10" letter-spacing="2" text-anchor="middle">YOUR WORKSPACE, IN ONE TAB</text>
  </g>

  <g class="mono" transform="translate(92 548)">
    <text fill="#777285" font-size="11" letter-spacing="1.6">HAZE.WEB · V5.0</text>
    <text x="930" fill="#777285" font-size="11" letter-spacing="1.6" text-anchor="end">OPEN THIS SVG ANYWHERE</text>
  </g>
</svg>
