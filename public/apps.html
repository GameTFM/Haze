<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>haze apps</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --aa: #ffffff;             /* accent, mirrors haze accent */
      --aa-ink: #0a0a0a;
      --pill: #0f0f0f;
      --pill-brd: #262626;
      --muted: #9a9a9a;
    }
    html { scrollbar-color: #333 #050505; }
    body {
      background: #050505; color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      padding: 14px 18px 60px;
    }

    /* ---------- floating pill nav ---------- */
    .a-nav {
      position: sticky; top: 12px; z-index: 20;
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid var(--pill-brd); border-radius: 999px;
      padding: 5px; backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
      max-width: calc(100vw - 36px);
    }
    .a-nav .a-logo {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 999px;
      background: var(--aa); color: var(--aa-ink);
      font-weight: 700; font-size: 0.85rem; letter-spacing: -0.01em;
      white-space: nowrap; cursor: pointer; border: none; font-family: inherit;
    }
    .a-nav .a-logo:active { transform: scale(0.97); }
    .a-nav .a-div { width: 1px; height: 18px; background: #2a2a2a; margin: 0 3px; flex: none; }
    .a-nav button.a-ico, .a-nav label.a-search {
      height: 34px; border-radius: 999px; border: none; background: transparent;
      color: #e8e8e8; font-family: inherit; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 0 12px; transition: background 0.15s ease; flex: none;
    }
    .a-nav button.a-ico:hover, .a-nav label.a-search:hover { background: #1d1d1d; }
    .a-nav button.a-ico.on { background: #242424; }
    .a-nav label.a-search { cursor: text; }
    .a-nav input {
      background: transparent; border: none; outline: none;
      color: #f5f5f5; font-family: inherit; font-size: 0.85rem; width: 150px;
    }
    .a-nav input::placeholder { color: #6e6e6e; }
    .a-nav .a-count { color: var(--muted); font-size: 0.72rem; padding: 0 10px 0 4px; white-space: nowrap; }

    /* ---------- sections ---------- */
    .a-section-title {
      font-size: 0.9rem; margin: 20px 2px 12px; color: #d8d8d8;
      display: flex; align-items: center; gap: 8px;
    }
    .a-section-title .a-clear {
      font-size: 0.72rem; color: var(--muted); background: none; border: none;
      cursor: pointer; text-decoration: underline; font-family: inherit;
    }
    .a-status { color: var(--muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }

    /* ---------- the hub grids ---------- */
    .a-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 12px;
    }
    .a-tile {
      position: relative; cursor: pointer; border-radius: 16px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: inherit; font-family: inherit; outline: none;
      display: flex; gap: 12px; align-items: flex-start;
      padding: 13px 14px; text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .a-tile:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.32); background: rgba(255, 255, 255, 0.07); }
    .a-tile:active { transform: scale(0.98); }
    .a-tile:focus-visible { border-color: var(--aa); }
    .a-icon {
      width: 46px; height: 46px; border-radius: 13px; flex: none;
      background: rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem;
    }
    .a-icon img { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; }
    .a-meta { min-width: 0; }
    .a-name { font-size: 0.86rem; font-weight: 700; letter-spacing: -0.01em; }
    .a-name code { font-size: 0.72rem; color: var(--muted); font-family: inherit; font-weight: 600; margin-left: 5px; }
    .a-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.4; margin-top: 3px; }
    .a-kind {
      display: inline-block; margin-top: 7px; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18); color: #cfcfcf;
    }
    .a-kind.builtin { border-color: var(--aa); color: var(--aa); }
    .a-kind.web { border-color: #7ab8ff; color: #7ab8ff; }
    .a-fav, .a-del {
      position: absolute; top: 8px; z-index: 3;
      width: 24px; height: 24px; border-radius: 999px; cursor: pointer;
      display: grid; place-items: center; font-size: 0.7rem; line-height: 1; padding: 0;
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.22);
      color: #9a9a9a; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease;
    }
    .a-fav { right: 8px; }
    .a-del { right: 36px; }
    .a-tile:hover .a-fav, .a-fav.active:hover, .a-fav.active, .a-tile:hover .a-del { opacity: 1; }
    .a-fav:hover, .a-del:hover { transform: scale(1.15); color: #fff; }
    .a-fav.active { color: #ffd166; border-color: #ffd166; }
    .a-del:hover { color: #ff8f8f; border-color: #ff8f8f; }

    /* ---------- add-your-own tile ---------- */
    .a-add {
      justify-content: center; align-items: center; flex-direction: column;
      border-style: dashed; text-align: center; gap: 4px;
      color: var(--muted); background: transparent;
      min-height: 86px;
    }
    .a-add .a-plus { font-size: 1.3rem; color: var(--aa); }
    .a-add:hover { color: #e8e8e8; background: rgba(255, 255, 255, 0.05); }

    @media (max-width: 560px) {
      .a-nav input { width: 90px; }
      .a-nav .a-count { display: none; }
      .a-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

        {id:"edpuzzle-cheats",name:"Edpuzzle Cheats",img:"https://cdn.jsdelivr.net/gh/InterstellarNetwork/Interstellar@main/static/assets/media/icons/ep.png",url:"https://github.com/ading2210/edpuzzle-answers"},
        {id:"deepai-org",name:"DeepAI.org",img:"https://cdn.jsdelivr.net/gh/InterstellarNetwork/Interstellar@main/static/assets/media/icons/da.webp",url:"https://deepai.org/"},
        {id:"freedomgpt",name:"FreedomGPT",img:"",url:"https://chat.freedomgpt.com/"},
        {id:"cinera-movies",name:"Cinera (Movies)",img:"https://cdn.jsdelivr.net/gh/InterstellarNetwork/Interstellar@main/static/assets/media/icons/MW.png",url:"https://cinera.to"},
        {id:"talkai-info",name:"TalkAI.info",img:"https://cdn.jsdelivr.net/gh/InterstellarNetwork/Interstellar@main/static/assets/media/icons/ta.webp",url:"https://talkai.info/chat/"},
      ].map(function (x) {
        x.kind = "url";
        x.web = true;
        x.desc = "From the Interstellar catalog — opened through the haze proxy.";
        return x;
      });

      var FAVS_KEY = "haze-hub-favs";
      var RECENT_KEY = "haze-hub-recent";
      var CUSTOM_KEY = "haze-hub-custom";
      var ICONS_KEY = "haze-hub-icons";
      var sections = document.getElementById("a-sections");
      var status = document.getElementById("a-status");
      var count = document.getElementById("a-count");
      var search = document.getElementById("a-search");
      var favMode = false;

      function loadJson(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || fallback); }
        catch (e) { return JSON.parse(fallback); }
      }
      function esc(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
      }
      function allApps() {
        return WEBAPPS;
      }
      function byId(id) {
        var list = allApps();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      function openTile(tile) {
        var recents = loadJson(RECENT_KEY, "[]").filter(function (r) { return r !== tile.id; });
        recents.unshift(tile.id);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recents.slice(0, 12))); } catch (e) {}
        try {
          if (tile.kind === "go" && window.parent && window.parent.hazeGo) {
            window.parent.hazeGo(tile.view);
            return;
          }
          if (tile.kind === "url" && window.parent && window.parent.hazeLaunch) {
            window.parent.hazeLaunch(tile.url);
            return;
          }
        } catch (e) {}
        // standalone fallback (hub opened outside haze)
        if (tile.url) window.open(tile.url, "_blank", "noopener");
      }

      function iconHtml(tile) {
        if (tile.img) {
          var cached = iconCache[tile.id];
          var src = cached ? cached : esc(tile.img);
          return '<span class="a-icon"><img src="' + src + '" alt="" loading="lazy" decoding="async" data-id="' + esc(tile.id) + '" onerror="this.remove()">' + "</span>";
        }
        return '<span class="a-icon">' + esc(tile.icon || "\uD83C\uDF10") + "</span>";
      }

      /* icon cache: first visit warms localStorage with data URLs so every
         later load paints instantly with zero network requests */
      var iconCache = loadJson(ICONS_KEY, "{}");
      var iconPending = {}; // id -> true while fetching

      function saveIconCache() {
        try {
          var total = JSON.stringify(iconCache).length;
          if (total > 3 * 1024 * 1024) {
            var keys = Object.keys(iconCache);
            var i = 0;
            while (JSON.stringify(iconCache).length > 2 * 1024 * 1024 && i < keys.length) {
              delete iconCache[keys[i++]];
            }
          }
          localStorage.setItem(ICONS_KEY, JSON.stringify(iconCache));
        } catch (e) { /* quota full - cache is best-effort */ }
      }

      function warmIcons(list) {
        var todo = [];
        for (var t of list) {
          if (!t.img) continue;
          if (!iconCache[t.id] && !iconPending[t.id]) todo.push(t);
        }
        var MAX_CONC = 6;
        var i = 0;
        function next() {
          if (i >= todo.length) return;
          var tile = todo[i++];
          iconPending[tile.id] = true;
          fetch(tile.img, { mode: "cors", cache: "force-cache" })
            .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.blob(); })
            .then(function (blob) {
              return new Promise(function (res) {
                var fr = new FileReader();
                fr.onload = function () { res(fr.result); };
                fr.onerror = function () { res(null); };
                fr.readAsDataURL(blob);
              });
            })
            .then(function (dataUrl) {
              if (dataUrl && String(dataUrl).length <= 30000) {
                iconCache[tile.id] = dataUrl;
                saveIconCache();
                var imgs = sections.querySelectorAll("img[data-id='" + tile.id + "']");
                for (var im of imgs) im.src = dataUrl;
              }
            })
            .catch(function () {})
            .then(function () {
              delete iconPending[tile.id];
              setTimeout(next, 40);
            });
        }
        for (var k = 0; k < MAX_CONC && k < todo.length; k++) next();
      }

      function tileHtml(tile) {
        var favs = loadJson(FAVS_KEY, "[]");
        var isFav = favs.indexOf(tile.id) !== -1;
        var credit = tile.by ? "<code>@" + esc(tile.by) + "</code>" : "";
        var kindLabel = tile.kind === "go" ? "built-in" : tile.custom ? "your app" : tile.web ? "web" : "github";
        var kindClass = tile.kind === "go" ? " builtin" : tile.web ? " web" : "";
        var del = tile.custom ? '<span class="a-del" data-del="' + esc(tile.id) + '" title="Remove this app" role="button" tabindex="0">\u2715</span>' : "";
        return (
          '<button class="a-tile" data-id="' + esc(tile.id) + '" type="button" aria-label="Open ' + esc(tile.name) + '">' +
          iconHtml(tile) +
          '<span class="a-meta"><span class="a-name">' + esc(tile.name) + credit + "</span>" +
          '<span class="a-desc" style="display:block">' + esc(tile.desc) + "</span>" +
          '<span class="a-kind' + kindClass + '">' + kindLabel + "</span></span>" +
          del +
          '<span class="a-fav' + (isFav ? " active" : "") + '" data-fav="' + esc(tile.id) + '" title="Favorite" role="button" tabindex="0">\u2605</span>' +
          "</button>"
        );
      }

      var ADD_TILE = '<button class="a-tile a-add" id="a-add-app" type="button" title="Add your own app">' +
        '<span class="a-plus">+</span><span style="font-size:0.78rem">Add your own app</span></button>';

      function section(title, listHtml, clearLabel) {
        var wrap = document.createElement("div");
        var h = document.createElement("div");
        h.className = "a-section-title";
        h.innerHTML = esc(title) + (clearLabel ? ' <button class="a-clear" type="button">' + esc(clearLabel) + "</button>" : "");
        wrap.appendChild(h);
        var grid = document.createElement("div");
        grid.className = "a-grid";
        grid.innerHTML = listHtml;
        wrap.appendChild(grid);
        if (clearLabel) {
          h.querySelector(".a-clear").addEventListener("click", function () {
            if (clearLabel === "forget") localStorage.removeItem(RECENT_KEY);
            else localStorage.removeItem(FAVS_KEY);
            render();
          });
        }
        return wrap;
      }

      function render() {
        var q = search.value.trim().toLowerCase();
        var favs = loadJson(FAVS_KEY, "[]");
        var list = allApps();

        if (q) {
          list = list.filter(function (t) {
            return (t.name + " " + t.desc).toLowerCase().indexOf(q) !== -1;
          });
        }
        if (favMode) list = list.filter(function (t) { return favs.indexOf(t.id) !== -1; });

        count.textContent = list.length + (list.length === 1 ? " app" : " apps");
        sections.innerHTML = "";

        if (!list.length) {
          status.hidden = false;
          status.textContent = favMode && !q
            ? "No favorites yet \u2014 hover an app and tap \u2605."
            : q ? 'No apps match "' + q + '".' : "";
          return;
        }
        status.hidden = true;

        sections.appendChild(section(favMode ? "\u2605 Favorites" : "Web apps", list.map(tileHtml).join("")));
        warmIcons(list);
      }

      function addCustomApp() {
        var name = (window.prompt ? prompt("Name this app (e.g. Notion)") : "") || "";
        if (!name.trim()) return;
        var url = prompt("URL for " + name.trim() + " (e.g. notion.so)") || "";
        if (!url.trim()) return;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url.replace(/^\/+/, "");
        var custom = loadJson(CUSTOM_KEY, "[]");
        var id = "c" + Math.random().toString(36).slice(2, 8);
        custom.push({ id: id, name: name.trim().slice(0, 30), icon: "\uD83C\uDF10", kind: "url", url: url, custom: true, desc: "Added by you \u2014 opens through the haze proxy." });
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom.slice(0, 60))); } catch (e2) {}
        render();
      }

      function removeCustomApp(id) {
        var custom = loadJson(CUSTOM_KEY, "[]").filter(function (c) { return c.id !== id; });
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); } catch (e) {}
        var favs = loadJson(FAVS_KEY, "[]").filter(function (f) { return f !== id; });
        try { localStorage.setItem(FAVS_KEY, JSON.stringify(favs)); } catch (e) {}
        render();
      }

      sections.addEventListener("click", function (e) {
        var delBtn = e.target.closest(".a-del");
        if (delBtn) {
          e.stopPropagation();
          removeCustomApp(delBtn.getAttribute("data-del"));
          return;
        }
        var favBtn = e.target.closest(".a-fav");
        if (favBtn) {
          e.stopPropagation();
          var id = favBtn.getAttribute("data-fav");
          var favs = loadJson(FAVS_KEY, "[]");
          var idx = favs.indexOf(id);
          if (idx === -1) favs.push(id); else favs.splice(idx, 1);
          try { localStorage.setItem(FAVS_KEY, JSON.stringify(favs.slice(0, 60))); } catch (e2) {}
          render();
          return;
        }
        if (e.target.closest(".a-add")) {
          addCustomApp();
          return;
        }
        var tile = e.target.closest(".a-tile");
        if (!tile || tile.getAttribute("data-id") === null) return;
        var picked = byId(tile.getAttribute("data-id"));
        if (picked) openTile(picked);
      });

      document.getElementById("a-favmode").addEventListener("click", function () {
        favMode = !favMode;
        this.classList.toggle("on", favMode);
        render();
      });
      document.getElementById("a-reset").addEventListener("click", function () {
        if (!confirm("Forget favorites, recents and your custom apps?")) return;
        localStorage.removeItem(FAVS_KEY);
        localStorage.removeItem(RECENT_KEY);
        localStorage.removeItem(CUSTOM_KEY);
        render();
      });
      document.getElementById("a-home").addEventListener("click", function () {
        favMode = false;
        search.value = "";
        document.getElementById("a-favmode").classList.remove("on");
        render();
      });

      var searchTimer = null;
      search.addEventListener("input", function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(render, 150);
      });

      // mirror haze's accent color (same origin - settings are shared)
      try {
        var accent = JSON.parse(localStorage.getItem("haze-settings") || "{}").accent;
        if (accent) document.documentElement.style.setProperty("--aa", accent);
      } catch (e) {}

      // exposed for the parent haze command palette ("Open a random app")
      window.hazeRandomApp = function () {
        openTile(WEBAPPS[Math.floor(Math.random() * WEBAPPS.length)]);
      };

      render();
    })();
  </script>
