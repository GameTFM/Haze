app = "haze"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# chat persistence: uncomment + `fly volumes create haze_data -r iad`
# [[mounts]]
#   source = "haze_data"
#   destination = "/data"
# then set CHAT_DB_PATH=/data/chat-data.json via `fly secrets set`

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
