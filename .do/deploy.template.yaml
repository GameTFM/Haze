spec:
  name: haze
  services:
    - name: web
      dockerfile_path: Dockerfile
      http_port: 8000
      instance_size_slug: apps-s-basic-xxs
      instance_count: 1
      routes:
        - path: /
      envs:
        - key: HOST
          value: 0.0.0.0
        - key: CHAT_SECRET
          type: SECRET
          generate_value: true
